<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Ātrs vai padziļināts VTDT karjeras tests ar personalizētu Top 3 profesiju virzienu rezultātu."
    >
    <link
      rel="icon"
      sizes="192x192"
      href="https://static.wixstatic.com/media/cfe1cd_7881fabba5e143aa9fa108d68e606379%7Emv2.jpg/v1/fill/w_192%2Ch_192%2Clg_1%2Cusm_0.66_1.00_0.01/cfe1cd_7881fabba5e143aa9fa108d68e606379%7Emv2.jpg"
      type="image/jpeg"
    >
    <link rel="stylesheet" href="styles.css?v=2026.6">
    <title>VTDT | Karjeras tests</title>
  </head>
  <body>
    <a class="skip-link" href="#question-container">Pāriet uz testu</a>

    <header class="header">
      <h1>VTDT KARJERAS TESTS</h1>
      <p>Izpēti iespējas, kas var dot Tev virzienu jau šodien!</p>
    </header>

    <main id="main-content" class="container">
      <section class="quiz-container" aria-label="Profesiju izvēles tests">
        <div id="progress-region" class="progress-region" hidden>
          <div class="progress-meta">
            <span id="progress-label">Atbildēti 0</span>
            <span id="question-label">Jautājums</span>
          </div>
          <div
            id="progress-track"
            class="progress-track"
            role="progressbar"
            aria-label="Testa progress"
            aria-valuemin="0"
            aria-valuemax="10"
            aria-valuenow="0"
          >
            <span id="progress-fill" class="progress-fill"></span>
          </div>
        </div>

        <div id="question-container" tabindex="-1"></div>
        <p id="live-region" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
      </section>
    </main>

    <footer class="credit-bar">
      <span>© Vidzemes Tehnoloģiju un dizaina tehnikums</span>
      <span class="separator" aria-hidden="true">|</span>
      <a href="https://www.vtdt.lv/profesijas" target="_blank" rel="noopener noreferrer">
        skatīt visas profesijas
      </a>
    </footer>

    <script type="module" src="js/app.js?v=2026.6"></script>
  </body>
</html>
